name: Build Windows installer for release

on:
  release:
    types:
      - published
  push:
    branches:
      - main
    paths:
      - .github/workflows/windows-build.yml

permissions:
  actions: write
  contents: write

jobs:
  cleanup-old-artifacts:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the newest legacy installer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=The-Last-Hour-Windows-x64&per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[1:] | .[].id' |
          while read -r artifact_id; do
            if [ -n "$artifact_id" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            fi
          done

  build-windows:
    if: github.event_name == 'release'
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run dist:win

      - name: Attach Windows files to the published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload $env:RELEASE_TAG release/*.exe release/*.zip --clobber --repo $env:GITHUB_REPOSITORY

      - name: Keep a temporary Actions copy
        uses: actions/upload-artifact@v4
        with:
          name: The-Last-Hour-Windows-x64-${{ github.event.release.tag_name }}
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 3
