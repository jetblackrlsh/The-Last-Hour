name: Build Windows installer for release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run dist:win

      - name: Attach Windows files to the published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload $env:RELEASE_TAG release/*.exe release/*.zip --clobber --repo $env:GITHUB_REPOSITORY

      - name: Keep a temporary Actions copy
        uses: actions/upload-artifact@v4
        with:
          name: The-Last-Hour-Windows-x64-${{ github.event.release.tag_name }}
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 3
